[package]
name = "sky"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
  "crates/sky-gateway",
  "crates/sky-middleware",
  "crates/sky-proto",
  "crates/sky-router",
  "crates/sky-runtime",
  "crates/sky-worker",
]

[workspace.package]
version = "0.1.0"
authors = ["Sky Framework Contributors"]
edition = "2024"
rust-version = "1.95"
readme = "README.md"
repository = "https://github.com/REPLACE/sky"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"

# Observability
tracing = "0.1"

# Error handling
thiserror = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers
uuid = { version = "1", features = ["serde", "v7"] }

# Async extensions (for timeouts, streams, etc.)
futures = "0.3"

# Human-readable duration parsing for configs
humantime-serde = "1"

prost = "0.13"
# tonic and prost - already used by sky-proto, now needed by sky-worker too
tonic = "0.12"

# tower for the transport layer
tower = "0.5"

# HTTP server and extractors
axum = "0.7"
# Unix socket connection handling
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower-http = { version = "0.6", features = ["limit", "trace", "cors"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config file parsing
toml = "0.8"

# Structured logging setup
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Top-level error convenience for the binary
anyhow = "1"
arc-swap = "1.9.1"
bytes = "1"
dashmap = { version = "6.1.0" }
fred = { version = "10", features = ["i-scripts"] }
jsonschema = "0.46.2"
rmp-serde = "1"
serde_bytes = "0.11"
socket2 = { version = "0.5", features = ["all"] }

sky-middleware = { path = "crates/sky-middleware" }
sky-proto = { path = "crates/sky-proto" }
sky-router = { path = "crates/sky-router" }
# Internal crates - declared here so member crates can reference by `workspace = true`
sky-runtime = { path = "crates/sky-runtime" }
sky-worker = { path = "crates/sky-worker" }

[profile.release]
lto = "thin"
codegen-units = 1
