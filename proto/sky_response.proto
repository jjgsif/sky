syntax = "proto3";

package sky.v1;

message SkyResponse {
  uint32 status = 1;
  bytes body = 2;
  map<string, string> headers = 3;
  repeated SetCookie cookies = 4;
}

message SetCookie {
  string name = 1;
  string value = 2;
  optional uint32 max_age = 3;
  optional string path = 4;
  optional string domain = 5;
  bool http_only = 6;
  bool secure = 7;
  optional string same_site = 8;
}