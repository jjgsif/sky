syntax = "proto3";

package sky.v1;

// WorkerControl is the framework-owned control-plane interface that
// every Sky worker must implement. The gateway uses this to health-check
// workers and coordinate graceful shutdown.
//
// This interface is part of the public API surface and is frozen as of
// sky.v1. Fields may be added to existing messages in a backward-compatible
// way. Changing field semantics, removing fields, or altering RPC signatures
// requires a new version (sky.v2, etc.) with a deprecation window.
service WorkerControl {
  // Health reports the worker's current status. Called periodically by
  // the supervisor to determine whether the worker can accept work.
  rpc Health(HealthRequest) returns (HealthResponse);

  // Shutdown signals the worker to begin graceful shutdown. The worker
  // should stop accepting new work, finish in-flight work up to the
  // grace period, and exit. Returning accepted=false indicates the
  // worker cannot shut down in its current state.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message HealthRequest {}

message HealthResponse {
  // Current worker status. Drives supervisor routing decisions.
  HealthStatus status = 1;

  // Semver or commit hash identifying the worker implementation version.
  // Included in health responses for operational debugging across
  // deployments.
  string worker_version = 2;

  // Free-form structured context. Workers may include diagnostic
  // information here, particularly when reporting UNHEALTHY. Keys
  // and values are opaque to the framework; intended for human
  // inspection during incident response.
  map<string, string> details = 3;
}

enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_READY = 1;
  HEALTH_STATUS_DRAINING = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
}

message ShutdownRequest {
  // Maximum seconds the worker has before being killed. Workers should
  // finish in-flight work within this window and exit cleanly.
  uint32 grace_period_seconds = 1;
}

message ShutdownResponse {
  // True if the worker has accepted the shutdown request and will stop.
  // False indicates the worker is refusing shutdown; supervisor may
  // escalate to forcible termination.
  bool accepted = 1;
}