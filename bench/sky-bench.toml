version = "1"

[listen]
address = "0.0.0.0:8080"
body_limit = "1mb"
accept_threads = 4

[logging]
# json eliminates pretty-printing overhead on the hot path.
format = "json"
# warn suppresses per-request info events (synchronous stdout writes);
# errors still surface.
level = "info"

[worker]
bun_path = "bun"
worker_script = "./worker/src/index.ts"
worker_version = "0.1.0"
pool_size = 10
