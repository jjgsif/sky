syntax = "proto3";

package sky.v1;

import "sky_response.proto";

service AdminService {
  rpc ListAdminUsers(ListAdminUsersRequest) returns (SkyResponse);
  rpc GetStats(GetStatsRequest) returns (SkyResponse);
}

message ListAdminUsersRequest {
  string x_admin_token = 1;
  string page = 2;
}

message GetStatsRequest {
  string x_admin_token = 1;
}
