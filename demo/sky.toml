# Sky Demo Application
# Run: sky build && SKY_WORKER_ID=1 bun run index.ts

version = "1"

[listen]
address = "0.0.0.0:8080"
body_limit = "1mb"

[logging]
format = "pretty"
level = "info"

[worker]
bun_path = "bun"
worker_script = "./index.ts"
worker_version = "0.1.0"
readiness_timeout = "10s"
shutdown_grace = "5s"
manifest_path = "./sky-manifest.json"

[frontend]
build      = "bun run --cwd frontend build"
output     = "./frontend/dist"
# Frontend source directories for staleness detection in production.
sources    = ["./frontend/src"]
dev_server = "http://localhost:5173/app"
# prefix defaults to "/" — the proxy is a catch-all fallback so asset paths
# reach Vite un-stripped. BrowserRouter basename="/app/" handles the /app/*
# prefix purely on the client side.

[build]
sources = ["./services", "./config"]
